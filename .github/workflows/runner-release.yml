name: Build portable Runner packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runner/**'
      - 'scripts/package_runner.py'
      - '.github/workflows/runner-release.yml'
  push:
    tags:
      - 'runner-v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install portable runner dependencies only
        run: npm install --prefix runner --omit=dev --no-audit --no-fund
      - name: Verify local runner dependencies
        run: node --test runner/token.test.mjs runner/server.test.mjs runner/lib.test.mjs
      - name: Package runner with Node runtime
        run: python scripts/package_runner.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: buttonpost-runner-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/runner-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: buttonpost-runner-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release from tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "ButtonPost Local Runner $GITHUB_REF_NAME"
